# 一覧ページを GitHub Pages に公開する。
# 置くのは、ビルドしてできた静的なファイル（dist/）だけ。秘密の値は使わない。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 公開に要る権限だけを渡す。リポジトリへの書き込みは許さない。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json のとおりに入れ、パッケージの導入時スクリプトは実行しない。
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
